<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Mijoté — les repas de la famille</title>
  <meta name="description" content="Planning des repas, recettes et liste de courses partagée pour toute la famille." />
  <meta name="theme-color" content="#FF5B2E" />
  <meta name="color-scheme" content="light dark" />

  <!-- iOS : application plein écran depuis l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mijoté" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Plus+Jakarta+Sans:wght@400..800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>#splash:not(.goodbye){position:fixed;inset:0;z-index:1000;background:radial-gradient(120% 90% at 50% 0%,#ffd9a8,#ff9b52 38%,#ff5b2e 70%,#c63a1c)}</style>

  <script>
    // Thème appliqué avant le premier rendu (pas de flash)
    (function () {
      var t = localStorage.getItem('mijote:theme');
      t = t ? JSON.parse(t) : 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Écran d'intro (affiché immédiatement, animé par js/intro.js) -->
  <div id="splash" class="splash" aria-hidden="true"></div>

  <div id="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>
  </div>

  <div id="layers"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript>Mijoté a besoin de JavaScript pour fonctionner.</noscript>
</body>
</html>
